<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>🎛️ Flexible Listening Test Maker | Custom Choices, Pictures, Questions</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(145deg, #eef2f7 0%, #dfe6ed 100%);
      font-family: 'Inter', system-ui, 'Segoe UI', Roboto, sans-serif;
      padding: 32px 24px;
      color: #0f2c3b;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    .card {
      background: rgba(255,255,255,0.97);
      border-radius: 40px;
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.08);
      padding: 28px 32px;
      margin-bottom: 28px;
      border: 1px solid rgba(255,255,255,0.7);
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(120deg, #1f4e8c, #3b7bb7);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    h2 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #1e4a76;
      margin-bottom: 1rem;
      border-left: 5px solid #2c7da0;
      padding-left: 16px;
    }
    h3 { font-size: 1.2rem; margin: 1rem 0 0.5rem; color: #2c5a80; }
    label {
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #2c3e50;
      display: block;
      margin-bottom: 5px;
    }
    input, textarea, select, button {
      font-family: inherit;
      border-radius: 20px;
      transition: 0.2s;
    }
    input, textarea, select {
      background: #fbfdff;
      border: 1.5px solid #e2e8f0;
      padding: 10px 16px;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #2c7da0;
      box-shadow: 0 0 0 3px rgba(44,125,160,0.2);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
    }
    .row > div { flex: 1; min-width: 180px; }
    .btn {
      border: none;
      padding: 10px 24px;
      font-weight: 600;
      border-radius: 40px;
      cursor: pointer;
      background: #eef2f8;
      color: #1e4a76;
    }
    .btn-primary { background: #1f6392; color: white; box-shadow: 0 4px 10px rgba(31,99,146,0.25); }
    .btn-primary:hover { background: #0f4b6e; transform: translateY(-2px); }
    .btn-secondary { background: #475569; color: white; }
    .btn-success { background: #2b8c5e; color: white; }
    .flex-buttons { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
    .section-card {
      background: #ffffff;
      border-radius: 32px;
      padding: 20px;
      margin-bottom: 32px;
      border: 1px solid #e2edf2;
      box-shadow: 0 6px 12px -8px rgba(0,0,0,0.05);
    }
    .question-item {
      background: #fafcff;
      border-radius: 28px;
      padding: 20px;
      margin-bottom: 24px;
      border: 1px solid #e9edf2;
    }
    .options-container {
      margin-top: 16px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 24px;
    }
    .option-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
      background: white;
      padding: 10px;
      border-radius: 20px;
    }
    .option-letter { font-weight: bold; width: 40px; }
    .option-field { flex: 1; }
    .option-img-preview { width: 60px; height: 60px; object-fit: contain; border-radius: 12px; border: 1px solid #ddd; }
    .remove-option { background: #fee2e2; border: none; padding: 4px 12px; border-radius: 30px; cursor: pointer; }
    .add-option-btn { margin-top: 8px; background: #e2e8f0; border: none; padding: 6px 16px; border-radius: 30px; cursor: pointer; font-size: 0.8rem; }
    .choices-control { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .remove-question, .remove-section {
      background: #fee2e2;
      color: #b91c1c;
      border: none;
      padding: 6px 16px;
      border-radius: 40px;
      cursor: pointer;
    }
    .audio-upload-area {
      background: #f0f9fe;
      border-radius: 40px;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 15px;
      margin: 10px 0;
    }
    .file-name {
      background: white;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      color: #1f6392;
    }
    #previewFrame {
      width: 100%;
      height: 620px;
      border-radius: 32px;
      border: 1px solid #cbd5e1;
      margin-top: 24px;
      background: white;
      display: none;
    }
    .legend {
      font-size: 0.75rem;
      background: #eef2ff;
      display: inline-block;
      padding: 6px 14px;
      border-radius: 60px;
      margin: 12px 0;
    }
    hr { margin: 16px 0; border-color: #e2e8f0; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
      <div>
        <h1>🎛️ Flexible Listening Test Maker</h1>
        <p style="color:#2c5f8a;">Decide number of choices (2‑6), pictures, statements per question. Mix types: MC text, True/False, Picture Matching.</p>
      </div>
      <button id="globalLangToggle" class="btn btn-primary" style="background:#2c7da0;">🇸🇦 العربية (Builder)</button>
    </div>
  </div>

  <div class="card">
    <h2>⚙️ Global Settings</h2>
    <div class="row">
      <div><label>Test Title</label><input type="text" id="testTitle" value="CUSTOM LISTENING TEST"></div>
      <div><label>Grade / Info</label><input type="text" id="gradeInfo" value="Grade 07"></div>
      <div><label>Background Color</label><input type="color" id="bgColor" value="#ffffff"></div>
      <div><label>⏱️ Timer (minutes)</label><input type="number" id="timerMin" min="0" value="0"></div>
    </div>
  </div>

  <div id="sectionsContainer"></div>

  <div class="card" style="text-align:center">
    <button id="addSectionBtn" class="btn btn-secondary">+ Add Listening Section</button>
  </div>

  <div class="card flex-buttons">
    <button id="generateTestBtn" class="btn btn-primary">⬇️ Download Test HTML</button>
    <button id="previewTestBtn" class="btn btn-success">👁️ Preview Test</button>
  </div>
  <iframe id="previewFrame"></iframe>
</div>

<script>
  // ------------------- STATE -------------------
  let sections = [];   // each: { title, instructions, audioBase64, audioFileName, questions: [] }
  let builderLang = 'en';

  const questionTypes = {
    MC_TEXT: 'mc_text',
    TRUE_FALSE: 'true_false',
    MATCH_PICTURE: 'match_picture'
  };

  const builderTrans = {
    en: {
      sectionTitle: "Section Title", instructions: "Instructions", audioLabel: "🎵 MP3 Audio",
      chooseMp3: "Choose MP3", noFile: "No file", addQuestion: "+ Add Question",
      removeSection: "Remove Section", questionType: "Question Type",
      typeMC: "Multiple Choice (text)", typeTF: "True / False", typePicture: "Matching with Pictures",
      questionText: "Question / Statement", numChoices: "Number of choices", updateChoices: "Update",
      optionPrefix: "Option", correctAnswer: "Correct answer", uploadImage: "Upload image",
      removeQuestion: "Remove", addOption: "+ Add option", defaultMCtext: "Choose the correct answer",
      defaultTFtext: "Statement based on audio", defaultPicText: "Match the picture",
      emptyWarning: "Complete all questions & upload audio.", audioWarning: "Upload MP3 for each section."
    },
    ar: {
      sectionTitle: "عنوان القسم", instructions: "التعليمات", audioLabel: "🎵 صوت MP3",
      chooseMp3: "اختر MP3", noFile: "لا ملف", addQuestion: "+ أضف سؤالاً",
      removeSection: "حذف القسم", questionType: "نوع السؤال",
      typeMC: "اختيار من متعدد (نص)", typeTF: "صواب / خطأ", typePicture: "مطابقة مع صور",
      questionText: "السؤال / العبارة", numChoices: "عدد الخيارات", updateChoices: "تحديث",
      optionPrefix: "خيار", correctAnswer: "الإجابة الصحيحة", uploadImage: "رفع صورة",
      removeQuestion: "حذف", addOption: "+ أضف خياراً", defaultMCtext: "اختر الإجابة الصحيحة",
      defaultTFtext: "عبارة مبنية على النص", defaultPicText: "طابق الصورة",
      emptyWarning: "أكمل جميع الأسئلة وارفع الصوت.", audioWarning: "ارفع MP3 لكل قسم."
    }
  };

  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }

  // Helper: create empty question with given type and initial choices count (default 3)
  function createEmptyQuestion(type, t, choicesCount = 3) {
    const base = { type, text: "", options: [], correctAnswer: "" };
    if (type === questionTypes.MC_TEXT) {
      base.text = t.defaultMCtext;
      for (let i = 0; i < choicesCount; i++) base.options.push({ letter: String.fromCharCode(65+i), text: `${t.optionPrefix} ${String.fromCharCode(65+i)}` });
      base.correctAnswer = "A";
    } 
    else if (type === questionTypes.TRUE_FALSE) {
      base.text = t.defaultTFtext;
      base.options = [{ letter: "A", text: "True / صواب" }, { letter: "B", text: "False / خطأ" }];
      base.correctAnswer = "A";
    } 
    else if (type === questionTypes.MATCH_PICTURE) {
      base.text = t.defaultPicText;
      for (let i = 0; i < choicesCount; i++) base.options.push({ letter: String.fromCharCode(65+i), imageData: null });
      base.correctAnswer = "A";
    }
    return base;
  }

  // Render full builder
  function renderBuilder() {
    const container = document.getElementById('sectionsContainer');
    if (!container) return;
    const t = builderTrans[builderLang];
    if (sections.length === 0) {
      container.innerHTML = `<div class="card" style="text-align:center;">➕ Click "Add Listening Section" to begin.</div>`;
      return;
    }
    let html = '';
    sections.forEach((sec, secIdx) => {
      html += `<div class="section-card" data-sec-idx="${secIdx}">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
          <h3>📌 ${t.sectionTitle}</h3>
          <button class="remove-section" data-idx="${secIdx}">${t.removeSection}</button>
        </div>
        <div class="row"><div><label>${t.sectionTitle}</label><input type="text" class="sec-title" value="${escapeHtml(sec.title)}"></div></div>
        <div><label>${t.instructions}</label><textarea class="sec-instr" rows="2">${escapeHtml(sec.instructions)}</textarea></div>
        <div><label>${t.audioLabel}</label>
          <div class="audio-upload-area">
            <button class="upload-audio-btn btn" data-idx="${secIdx}" style="background:#2c7da0; color:white;">${t.chooseMp3}</button>
            <span class="audio-filename">${sec.audioFileName || t.noFile}</span>
            <input type="file" accept="audio/mpeg" class="hidden-audio-input" data-idx="${secIdx}" style="display:none;">
          </div>
        </div>
        <hr>
        <h4>📋 Questions</h4>
        <div class="questions-list" data-sec="${secIdx}">`;
      sec.questions.forEach((q, qIdx) => {
        html += `<div class="question-item" data-qidx="${qIdx}" data-type="${q.type}">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:12px;">
            <strong>${builderLang === 'en' ? 'Question' : 'سؤال'} ${qIdx+1}</strong>
            <button class="remove-question-btn" data-sec="${secIdx}" data-q="${qIdx}" style="background:#fee2e2; border:none; padding:4px 12px; border-radius:30px;">${t.removeQuestion}</button>
          </div>
          <div><label>${t.questionType}</label><select class="question-type-select" data-sec="${secIdx}" data-q="${qIdx}">
            <option value="${questionTypes.MC_TEXT}" ${q.type === questionTypes.MC_TEXT ? 'selected' : ''}>${t.typeMC}</option>
            <option value="${questionTypes.TRUE_FALSE}" ${q.type === questionTypes.TRUE_FALSE ? 'selected' : ''}>${t.typeTF}</option>
            <option value="${questionTypes.MATCH_PICTURE}" ${q.type === questionTypes.MATCH_PICTURE ? 'selected' : ''}>${t.typePicture}</option>
          </select></div>
          <div><label>${t.questionText}</label><input type="text" class="q-text" value="${escapeHtml(q.text)}"></div>`;
        
        // Choices control (only for MC_TEXT and MATCH_PICTURE; TF is fixed)
        if (q.type !== questionTypes.TRUE_FALSE) {
          html += `<div class="choices-control"><label>${t.numChoices}</label>
            <input type="number" class="choices-count" min="2" max="6" value="${q.options.length}" style="width:80px;">
            <button class="update-choices-btn" data-sec="${secIdx}" data-q="${qIdx}" style="background:#cbd5e1; border:none; padding:6px 12px; border-radius:30px;">${t.updateChoices}</button>
          </div>`;
        }
        html += `<div class="options-container" data-opt-area="${secIdx}_${qIdx}">`;
        q.options.forEach((opt, optIdx) => {
          const letter = String.fromCharCode(65 + optIdx);
          if (q.type === questionTypes.MC_TEXT) {
            html += `<div class="option-row"><span class="option-letter">${letter}.</span>
              <div class="option-field"><input type="text" class="opt-text" value="${escapeHtml(opt.text)}" placeholder="${t.optionPrefix} ${letter}"></div>
              <button class="remove-option-btn" data-sec="${secIdx}" data-q="${qIdx}" data-optidx="${optIdx}" style="background:#fee2e2; border:none; padding:4px 10px; border-radius:30px;">✖</button>
            </div>`;
          } else if (q.type === questionTypes.MATCH_PICTURE) {
            const imgSrc = opt.imageData || '';
            html += `<div class="option-row"><span class="option-letter">${letter}.</span>
              <div class="option-field"><input type="file" accept="image/*" class="upload-picture-opt" data-sec="${secIdx}" data-q="${qIdx}" data-optidx="${optIdx}" style="display:inline-block; width:auto;"><br>
              <img class="preview-img" src="${imgSrc || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2260%22 height=%2260%22 fill=%22%23f1f5f9%22/%3E%3Ctext x=%2220%22 y=%2235%22 fill=%22%2394a3b8%22%3E📷%3C/text%3E%3C/svg%3E'}" style="width:60px; height:60px; object-fit:contain;"></div>
              <button class="remove-option-btn" data-sec="${secIdx}" data-q="${qIdx}" data-optidx="${optIdx}" style="background:#fee2e2; border:none; padding:4px 10px; border-radius:30px;">✖</button>
            </div>`;
          }
        });
        if (q.type !== questionTypes.TRUE_FALSE) {
          html += `<div style="margin-top:8px;"><button class="add-option-btn" data-sec="${secIdx}" data-q="${qIdx}" style="background:#e2e8f0; border:none; padding:4px 12px; border-radius:30px;">+ ${t.addOption}</button></div>`;
        }
        html += `</div><div><label>${t.correctAnswer}</label><select class="correct-select">`;
        q.options.forEach((_, idx) => {
          const letter = String.fromCharCode(65+idx);
          html += `<option value="${letter}" ${q.correctAnswer === letter ? 'selected' : ''}>${letter}</option>`;
        });
        html += `</select></div></div>`;
      });
      html += `</div><div style="margin-top:16px;"><button class="add-question-to-section btn btn-secondary" data-sec="${secIdx}" style="background:#94a3b8;">+ ${t.addQuestion}</button></div></div>`;
    });
    container.innerHTML = html;
    attachBuilderEvents();
  }

  function attachBuilderEvents() {
    // remove section, audio upload, add question, remove question, type change, update choices, add/remove option, live updates
    document.querySelectorAll('.remove-section').forEach(btn => {
      btn.addEventListener('click', (e) => { const idx = parseInt(btn.dataset.idx); sections.splice(idx,1); renderBuilder(); });
    });
    document.querySelectorAll('.upload-audio-btn').forEach(btn => {
      btn.addEventListener('click', (e) => { const secIdx = parseInt(btn.dataset.idx); const input = btn.parentElement.querySelector('.hidden-audio-input'); if(input) input.click(); });
    });
    document.querySelectorAll('.hidden-audio-input').forEach(input => {
      input.addEventListener('change', (e) => {
        const secIdx = parseInt(input.dataset.idx);
        const file = e.target.files[0];
        if (file && file.type.includes('mpeg')) {
          const reader = new FileReader();
          reader.onload = (ev) => { sections[secIdx].audioBase64 = ev.target.result; sections[secIdx].audioFileName = file.name; renderBuilder(); };
          reader.readAsDataURL(file);
        } else if (file) alert('Select MP3');
      });
    });
    document.querySelectorAll('.add-question-to-section').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const secIdx = parseInt(btn.dataset.sec);
        const t = builderTrans[builderLang];
        const newQ = createEmptyQuestion(questionTypes.MC_TEXT, t, 3);
        sections[secIdx].questions.push(newQ);
        renderBuilder();
      });
    });
    document.querySelectorAll('.remove-question-btn').forEach(btn => {
      btn.addEventListener('click', (e) => { const secIdx = parseInt(btn.dataset.sec); const qIdx = parseInt(btn.dataset.q); sections[secIdx].questions.splice(qIdx,1); renderBuilder(); });
    });
    document.querySelectorAll('.question-type-select').forEach(sel => {
      sel.addEventListener('change', (e) => {
        const secIdx = parseInt(sel.dataset.sec); const qIdx = parseInt(sel.dataset.q);
        const newType = sel.value;
        const oldQ = sections[secIdx].questions[qIdx];
        const t = builderTrans[builderLang];
        let newQ;
        if (newType === questionTypes.MC_TEXT) newQ = createEmptyQuestion(questionTypes.MC_TEXT, t, 3);
        else if (newType === questionTypes.TRUE_FALSE) newQ = createEmptyQuestion(questionTypes.TRUE_FALSE, t, 2);
        else newQ = createEmptyQuestion(questionTypes.MATCH_PICTURE, t, 3);
        newQ.text = oldQ.text;
        sections[secIdx].questions[qIdx] = newQ;
        renderBuilder();
      });
    });
    // update choices count
    document.querySelectorAll('.update-choices-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const secIdx = parseInt(btn.dataset.sec); const qIdx = parseInt(btn.dataset.q);
        const countInput = btn.parentElement.querySelector('.choices-count');
        let newCount = parseInt(countInput.value);
        if (isNaN(newCount)) newCount = 3;
        newCount = Math.min(6, Math.max(2, newCount));
        const q = sections[secIdx].questions[qIdx];
        const currentOpts = q.options;
        const newOpts = [];
        for (let i = 0; i < newCount; i++) {
          const letter = String.fromCharCode(65+i);
          if (i < currentOpts.length) {
            newOpts.push({ ...currentOpts[i] });
          } else {
            if (q.type === questionTypes.MC_TEXT) newOpts.push({ letter, text: `${builderTrans[builderLang].optionPrefix} ${letter}` });
            else if (q.type === questionTypes.MATCH_PICTURE) newOpts.push({ letter, imageData: null });
            else newOpts.push({ letter, text: "" });
          }
        }
        q.options = newOpts;
        if (q.correctAnswer && q.correctAnswer.charCodeAt(0)-65 >= newCount) q.correctAnswer = "A";
        renderBuilder();
      });
    });
    // add option
    document.querySelectorAll('.add-option-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const secIdx = parseInt(btn.dataset.sec); const qIdx = parseInt(btn.dataset.q);
        const q = sections[secIdx].questions[qIdx];
        if (q.options.length >= 6) return;
        const newLetter = String.fromCharCode(65 + q.options.length);
        if (q.type === questionTypes.MC_TEXT) q.options.push({ letter: newLetter, text: `${builderTrans[builderLang].optionPrefix} ${newLetter}` });
        else if (q.type === questionTypes.MATCH_PICTURE) q.options.push({ letter: newLetter, imageData: null });
        renderBuilder();
      });
    });
    // remove option
    document.querySelectorAll('.remove-option-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const secIdx = parseInt(btn.dataset.sec); const qIdx = parseInt(btn.dataset.q); const optIdx = parseInt(btn.dataset.optidx);
        const q = sections[secIdx].questions[qIdx];
        if (q.options.length <= 2) return;
        q.options.splice(optIdx, 1);
        if (q.correctAnswer && q.correctAnswer.charCodeAt(0)-65 >= q.options.length) q.correctAnswer = "A";
        renderBuilder();
      });
    });
    // Live updates for text fields, correct select, picture upload
    for (let s = 0; s < sections.length; s++) {
      const secCard = document.querySelector(`.section-card[data-sec-idx="${s}"]`);
      if (!secCard) continue;
      const titleInp = secCard.querySelector('.sec-title');
      const instrArea = secCard.querySelector('.sec-instr');
      if (titleInp) titleInp.addEventListener('input', (e) => { sections[s].title = e.target.value; });
      if (instrArea) instrArea.addEventListener('input', (e) => { sections[s].instructions = e.target.value; });
      const qDivs = secCard.querySelectorAll('.question-item');
      qDivs.forEach((div, qIdx) => {
        const qText = div.querySelector('.q-text');
        if (qText) qText.addEventListener('input', (e) => { sections[s].questions[qIdx].text = e.target.value; });
        const correctSelect = div.querySelector('.correct-select');
        if (correctSelect) correctSelect.addEventListener('change', (e) => { sections[s].questions[qIdx].correctAnswer = e.target.value; });
        const type = sections[s].questions[qIdx].type;
        if (type === questionTypes.MC_TEXT) {
          const optTexts = div.querySelectorAll('.opt-text');
          optTexts.forEach((inp, idx) => {
            inp.addEventListener('input', (e) => { if (sections[s].questions[qIdx].options[idx]) sections[s].questions[qIdx].options[idx].text = e.target.value; });
          });
        } else if (type === questionTypes.MATCH_PICTURE) {
          const uploads = div.querySelectorAll('.upload-picture-opt');
          uploads.forEach((up, idx) => {
            up.addEventListener('change', (e) => {
              const file = e.target.files[0];
              if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                  sections[s].questions[qIdx].options[idx].imageData = ev.target.result;
                  const preview = up.parentElement.querySelector('.preview-img');
                  if (preview) preview.src = ev.target.result;
                };
                reader.readAsDataURL(file);
              }
            });
          });
        }
      });
    }
  }

  function addDefaultSection() {
    const t = builderTrans[builderLang];
    const newSec = {
      title: builderLang === 'en' ? `Listening Section ${sections.length+1}` : `قسم استماع ${sections.length+1}`,
      instructions: t.defaultInstructions || "Listen and answer.",
      audioBase64: null, audioFileName: null,
      questions: [
        createEmptyQuestion(questionTypes.MC_TEXT, t, 3),
        createEmptyQuestion(questionTypes.TRUE_FALSE, t, 2)
      ]
    };
    sections.push(newSec);
    renderBuilder();
  }

  function collectTestData() {
    const title = document.getElementById('testTitle').value.trim() || "Listening Test";
    const grade = document.getElementById('gradeInfo').value.trim();
    const bgColor = document.getElementById('bgColor').value;
    const timer = parseInt(document.getElementById('timerMin').value) || 0;
    const validSections = [];
    const t = builderTrans[builderLang];
    for (let i=0; i<sections.length; i++) {
      const sec = sections[i];
      if (!sec.audioBase64) { alert(`${t.audioWarning} (${sec.title})`); return null; }
      const validQs = sec.questions.filter(q => {
        if (!q.text.trim()) return false;
        if (q.type === questionTypes.MC_TEXT) return q.options.every(opt => opt.text.trim());
        if (q.type === questionTypes.TRUE_FALSE) return true;
        if (q.type === questionTypes.MATCH_PICTURE) return q.options.every(opt => opt.imageData);
        return false;
      });
      if (validQs.length === 0) { alert(`${t.emptyWarning} (${sec.title})`); return null; }
      validSections.push({ ...sec, questions: validQs });
    }
    if (validSections.length === 0) { alert(t.emptyWarning); return null; }
    return { title, grade, bgColor, timer, sections: validSections };
  }

  function generateTestHTML(data) {
    let sectionsHTML = '';
    let totalQs = 0;
    data.sections.forEach((sec, secIdx) => {
      let questionsHTML = '';
      sec.questions.forEach((q, qIdx) => {
        totalQs++;
        const radioName = `sec${secIdx}_q${qIdx}`;
        if (q.type === questionTypes.MC_TEXT) {
          let optionsHtml = '';
          q.options.forEach((opt, idx) => {
            const letter = String.fromCharCode(65+idx);
            optionsHtml += `<label class="mc-label"><input type="radio" name="${radioName}" value="${letter}" data-correct="${q.correctAnswer === letter}"> ${letter}. ${escapeHtml(opt.text)}</label>`;
          });
          questionsHTML += `<div class="question mc"><div class="q-text">${escapeHtml(q.text)}</div><div class="mc-choices">${optionsHtml}</div></div>`;
        } 
        else if (q.type === questionTypes.TRUE_FALSE) {
          questionsHTML += `<div class="question tf"><div class="q-text">${escapeHtml(q.text)}</div><div class="tf-choices"><label><input type="radio" name="${radioName}" value="A" data-correct="${q.correctAnswer === 'A'}"> ✓ True / صواب</label><label><input type="radio" name="${radioName}" value="B" data-correct="${q.correctAnswer === 'B'}"> ✗ False / خطأ</label></div></div>`;
        }
        else if (q.type === questionTypes.MATCH_PICTURE) {
          let optionsHtml = '';
          q.options.forEach((opt, idx) => {
            const letter = String.fromCharCode(65+idx);
            const imgSrc = opt.imageData || '';
            optionsHtml += `<label class="img-label"><input type="radio" name="${radioName}" value="${letter}" data-correct="${q.correctAnswer === letter}"><img src="${imgSrc}" alt="${letter}"><span>${letter}</span></label>`;
          });
          questionsHTML += `<div class="question picture"><div class="q-text">${escapeHtml(q.text)}</div><div class="picture-choices">${optionsHtml}</div></div>`;
        }
      });
      const audioEmbed = `<audio controls class="section-audio"><source src="${sec.audioBase64}" type="audio/mpeg"></audio>`;
      sectionsHTML += `<div class="listening-section"><div class="section-header">🎧 ${escapeHtml(sec.title)}</div><div class="section-instr">📢 ${escapeHtml(sec.instructions)}</div><div class="audio-wrapper">${audioEmbed}</div><div class="questions-area">${questionsHTML}</div></div>`;
    });

    const timerScript = data.timer > 0 ? `let timeLeft=${data.timer*60};const td=document.createElement('div');td.id="timerDisplay";td.className="timer-pill";document.querySelector('.test-container').prepend(td);setInterval(()=>{if(timeLeft<=0){clearInterval();td.textContent="Time's up!";alert("Time up!");computeScore();}else{timeLeft--;const m=Math.floor(timeLeft/60),s=timeLeft%60;td.textContent=\`⏱️ Time left: \${m.toString().padStart(2,'0')}:\${s.toString().padStart(2,'0')}\`;}},1000);` : '';

    const translations = { en: { submit:"✅ Submit", clear:"🗑️ Clear", back:"🏠 Dashboard", score:"🏆 Score" }, ar: { submit:"✅ إرسال", clear:"🗑️ مسح", back:"🏠 لوحة التحكم", score:"🏆 الدرجة" } };
    return `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${escapeHtml(data.title)}</title><style>
*{margin:0;padding:0;box-sizing:border-box;}body{background:${data.bgColor};font-family:'Segoe UI',system-ui;padding:30px 20px;max-width:1100px;margin:0 auto;}.test-container{background:white;border-radius:48px;padding:32px 36px;box-shadow:0 20px 35px rgba(0,0,0,0.1);}h1{color:#1e4a76;}.sub{color:#2c6280;margin-bottom:20px;}.listening-section{background:#fefefe;border-radius:32px;padding:24px;margin-bottom:32px;border:1px solid #e2edf2;}.section-header{font-size:1.5rem;font-weight:bold;color:#1f6392;}.section-instr{background:#eef3fc;padding:12px 18px;border-radius:28px;margin:12px 0;}.audio-wrapper{text-align:center;margin:18px 0;}.section-audio{width:100%;max-width:450px;}.question{background:#fafdff;border-radius:28px;padding:20px;margin-bottom:24px;border:1px solid #e9edf2;}.q-text{font-weight:600;margin-bottom:16px;}.mc-choices,.tf-choices,.picture-choices{display:flex;flex-wrap:wrap;gap:16px;}.mc-label,.tf-choices label,.img-label{display:flex;align-items:center;gap:8px;background:#f9fafc;padding:8px 20px;border-radius:40px;cursor:pointer;}.img-label{flex-direction:column;text-align:center;padding:10px;}.img-label img{width:100px;height:100px;object-fit:contain;border-radius:16px;}input[type="radio"]{appearance:none;width:18px;height:18px;border:2px solid #2c5a80;border-radius:50%;}input[type="radio"]:checked{background:#1f6392;box-shadow:inset 0 0 0 3px white;}input.correct-highlight{background:#10b981;}input.incorrect-highlight{background:#ef4444;}.score-panel{background:#eef3fa;border-radius:60px;padding:14px;text-align:center;font-weight:bold;font-size:1.2rem;margin:24px 0;}.action-bar{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:20px 0 16px;}button{padding:10px 26px;border:none;border-radius:60px;font-weight:600;cursor:pointer;}.btn-submit{background:#2c7da0;color:white;}.btn-clear{background:#94a3b8;color:white;}.btn-dashboard{background:#475569;color:white;}.lang-toggle{background:#1f6392;color:white;}.timer-pill{background:#0f172a;color:white;padding:8px 20px;border-radius:60px;width:fit-content;margin:0 auto 20px auto;}</style></head>
<body><div class="test-container"><h1>${escapeHtml(data.title)}</h1><div class="sub">${escapeHtml(data.grade)}</div>${sectionsHTML}<div class="score-panel" id="scorePanel">🏆 Score: 0 / ${totalQs}</div><div class="action-bar"><button id="submitBtn" class="btn-submit">✅ Submit</button><button id="clearBtn" class="btn-clear">🗑️ Clear</button><button id="dashboardBtn" class="btn-dashboard">🏠 Dashboard</button><button id="langToggleBtn" class="lang-toggle">🇸🇦 العربية</button></div></div>
<script>const total=${totalQs};let lang='en';const dict=${JSON.stringify(translations)};function updateUI(){document.getElementById('submitBtn').innerText=dict[lang].submit;document.getElementById('clearBtn').innerText=dict[lang].clear;document.getElementById('dashboardBtn').innerText=dict[lang].back;let sc=document.getElementById('scorePanel');let cur=sc.innerText.match(/\\d+/)?.[0]||'0';sc.innerHTML=\`\${dict[lang].score}: \${cur}/\${total}\`;}
function clearAll(){document.querySelectorAll('input[type="radio"]').forEach(r=>{r.checked=false;r.classList.remove('correct-highlight','incorrect-highlight');});document.getElementById('scorePanel').innerHTML=\`\${dict[lang].score}: 0/\${total}\`;}
function computeScore(){let correct=0;let groups=new Map();document.querySelectorAll('input[type="radio"]').forEach(r=>{let n=r.name;if(!groups.has(n))groups.set(n,[]);groups.get(n).push(r);});for(let[_,radios] of groups){let selected=null;radios.forEach(r=>{if(r.checked)selected=r.value;});radios.forEach(r=>{r.classList.remove('correct-highlight','incorrect-highlight');let isCor=r.dataset.correct==='true';if(isCor)r.classList.add('correct-highlight');if(selected&&r.value===selected&&!isCor)r.classList.add('incorrect-highlight');});let correctRadio=Array.from(radios).find(r=>r.dataset.correct==='true');if(selected&&correctRadio&&correctRadio.value===selected)correct++;}document.getElementById('scorePanel').innerHTML=\`\${dict[lang].score}: \${correct}/\${total}\`;}
document.getElementById('submitBtn').onclick=computeScore;document.getElementById('clearBtn').onclick=clearAll;document.getElementById('dashboardBtn').onclick=()=>window.location.href='/';document.getElementById('langToggleBtn').onclick=()=>{lang=lang==='en'?'ar':'en';updateUI();};updateUI();${timerScript}<\/script></body></html>`;
  }

  function downloadTest() { const d=collectTestData(); if(d){ const html=generateTestHTML(d); const blob=new Blob([html],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=d.title.replace(/\s+/g,'_')+'_flex_test.html'; a.click(); URL.revokeObjectURL(a.href); } }
  function previewTest() { const d=collectTestData(); if(d){ document.getElementById('previewFrame').style.display='block'; document.getElementById('previewFrame').srcdoc=generateTestHTML(d); document.getElementById('previewFrame').scrollIntoView({behavior:'smooth'}); } }

  document.getElementById('globalLangToggle').addEventListener('click',()=>{ builderLang=builderLang==='en'?'ar':'en'; renderBuilder(); document.getElementById('globalLangToggle').innerText=builderLang==='en'?'🇸🇦 العربية (Builder)':'🇬🇧 English (Builder)'; });
  document.getElementById('addSectionBtn').addEventListener('click',addDefaultSection);
  document.getElementById('generateTestBtn').addEventListener('click',downloadTest);
  document.getElementById('previewTestBtn').addEventListener('click',previewTest);
  addDefaultSection();
</script>
</body>
</html>
